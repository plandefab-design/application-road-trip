# XcodeGen spec — the .xcodeproj is generated in CI (never committed).
# Local (Mac only, optional): brew install xcodegen && xcodegen generate
name: MotoTrip
options:
  bundleIdPrefix: fr.plandefab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TripCore:
    path: ../core
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0

targets:
  MotoTrip:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: TripCore
      - package: MapLibre
    scheme:                      # shared scheme for xcodebuild in CI
      testTargets: [MotoTripTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.plandefab.mototrip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          DEAD_CODE_STRIPPING: NO  # the simulator tests call TripCore through the app
    info:
      path: Info.plist   # generated by XcodeGen (gitignored)
      properties:
        CFBundleDisplayName: Moto Road
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSLocationWhenInUseUsageDescription: "Moto Road utilise ta position pour te guider et t'annoncer radars et dangers."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Moto Road continue de te guider et de t'alerter écran verrouillé pendant la navigation."
        UIBackgroundModes: [location, audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
          - CFBundleTypeName: Trip JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]

  # Simulator tests of what UIKit draws (road book PDF and its viewer), run in CI before each release.
  MotoTripTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MotoTrip
      - package: TripCore
        link: false              # already in the host app (one copy of TripCore)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.plandefab.mototrip.tests
        GENERATE_INFOPLIST_FILE: YES
