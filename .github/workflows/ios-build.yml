# A1 — Build + tests + publication of the unsigned IPA, then SideStore source update (A2).
name: iOS build

on:
  push:
    branches: [main]
    paths-ignore:
      - "distribution/**"
      - "**.md"
      - "companion/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15            # pinned — never macos-latest (CLAUDE.md)
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_16.4.app
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: TripCore tests
        working-directory: core
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: app/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('app/project.yml') }}

      - name: Archive (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MotoTrip.xcodeproj \
            -scheme MotoTrip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MotoTrip.xcarchive \
            -clonedSourcePackagesDirPath .spm \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200

      # What UIKit draws cannot be tested on Windows: the road book PDF and its viewer are checked on an iPhone
      # simulator before anything is released (screenshots kept as an artifact).
      - name: App tests (iPhone simulator)
        working-directory: app
        timeout-minutes: 20
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in sorted(devices, reverse=True) if 'iOS' in runtime
                     for d in devices[runtime] if d['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project MotoTrip.xcodeproj \
            -scheme MotoTrip \
            -destination "id=$DEVICE" \
            -clonedSourcePackagesDirPath .spm \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E --line-buffered "Test (Case|Suite)|error:|Executed|TEST (SUCCEEDED|FAILED)|Failing tests|BUILD FAILED|exceeded|DIAG"

      - name: Keep test screenshots
        if: always()
        run: |
          mkdir -p test-shots
          find ~/Library/Developer/CoreSimulator/Devices -path '*MotoRoadTestShots/*.png' -exec cp {} test-shots/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-shots
          path: test-shots
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R app/build/MotoTrip.xcarchive/Products/Applications/MotoTrip.app dist/Payload/
          cd dist && zip -qry "MotoRoad-$VERSION.ipa" Payload
          echo "IPA_SIZE=$(stat -f%z "MotoRoad-$VERSION.ipa")" >> "$GITHUB_ENV"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Moto Road ${{ env.VERSION }}
          files: dist/MotoRoad-${{ env.VERSION }}.ipa
          body: "Build ${{ env.BUILD }} — commit ${{ github.sha }}. Installer via SideStore (source : distribution/source.json)."

      - name: Update SideStore source
        run: |
          python3 scripts/update_source.py \
            --source distribution/source.json \
            --repo "${{ github.repository }}" \
            --version "$VERSION" --build "$BUILD" --size "$IPA_SIZE" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/MotoRoad-$VERSION.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/source.json
          git commit -m "chore(distribution): Moto Road $VERSION [skip ci]"
          git push
