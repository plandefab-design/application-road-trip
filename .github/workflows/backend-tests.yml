# The group server's schema and access rules (backend/supabase/schema.sql) on a throw-away PostgreSQL: members see
# their group, an outsider sees nothing, positions expire, the schema can be run again. No Mac minutes.
name: Backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase stand-ins
        run: psql -v ON_ERROR_STOP=1 -q -f backend/supabase/tests/stub.sql
      - name: Apply schema.sql
        run: psql -v ON_ERROR_STOP=1 -q -f backend/supabase/schema.sql
      - name: Apply it again (must be re-runnable)
        run: psql -v ON_ERROR_STOP=1 -q -f backend/supabase/schema.sql
      - name: Isolation scenarios
        run: psql -v ON_ERROR_STOP=1 -q -f backend/supabase/tests/isolation.sql
