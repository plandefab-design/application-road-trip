name: Companion tests

on:
  push:
    paths: ["companion/**", ".github/workflows/companion-tests.yml"]
  pull_request:
    paths: ["companion/**"]
  workflow_dispatch:

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q
      - name: GraphHopper custom models are valid JSON (comments stripped)
        working-directory: companion/graphhopper/custom_models
        run: |
          python - <<'EOF'
          import json, pathlib, re
          for f in pathlib.Path('.').glob('*.json'):
              json.loads(re.sub(r'^\s*//.*$', '', f.read_text(), flags=re.M))
              print('ok', f)
          EOF
